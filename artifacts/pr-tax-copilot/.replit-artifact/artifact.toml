kind = "web"
previewPath = "/"
title = "Puerto Rico Tax Copilot"
version = "1.0.0"
id = "artifacts/pr-tax-copilot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23216

[services.development]
run = "pnpm --filter @workspace/pr-tax-copilot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pr-tax-copilot", "run", "build" ]
publicDir = "artifacts/pr-tax-copilot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23216"
BASE_PATH = "/"
